[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Text-to-SQL AI Data Analyst Agent: plain-English questions to validated SQL, charts and insights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anas Riaz" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "sqlparse>=0.5",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "streamlit>=1.35",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
kaggle = ["kaggle>=1.6"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["text_to_sql_agent*"]
