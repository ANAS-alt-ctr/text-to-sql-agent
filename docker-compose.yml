# Run both services locally with Docker:
#   docker compose up --build
# API at http://localhost:8000  |  UI at http://localhost:8501
# Set LLM_API_KEY in a .env file first (see .env.example).

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_URL: sqlite:///./data/sample.db
    volumes:
      - ./data:/app/data

  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DB_URL: sqlite:///./data/sample.db
    volumes:
      - ./data:/app/data
    depends_on:
      - api
